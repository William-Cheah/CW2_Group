# ============================================================
# MaskablePPO training config - BloodChain-v0   (owner: C)
# Every value here must be justified in report Section 2.2.1
# ============================================================
run_name: mppo_lr3e-4
env:
  train_scenario: moderate      # CONTRACT: train on moderate floods
  test_scenario: severe         # CONTRACT: unseen test = severe floods
  n_envs: 4                     # parallel copies for faster data collection
seeds:
  train: [0, 1, 2]              # CONTRACT: training seeds
  val_start: 5000               # validation seeds 5000-5019 (used to pick the best checkpoint)
  eval_start: 10000             # CONTRACT: evaluation seeds 10000-10099 (never used in training)
  eval_episodes: 100
total_timesteps: 300000         # v0 starting point - increase once learning works
ppo:
  learning_rate: 3.0e-4
  n_steps: 512                  # per env -> 2048 samples per update (~21 episodes of 96 steps)
  batch_size: 128
  n_epochs: 10
  gamma: 0.99                   # ~100-step horizon = the whole 24 h episode
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
policy:
  net_arch: [64, 64]
eval_freq: 20000                # steps between validation checks (MaskableEvalCallback)
